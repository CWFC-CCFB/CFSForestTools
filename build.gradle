/*
 *  Build file for gradle
 */


plugins {
    id 'com.palantir.git-version' version '3.0.0'
    id 'maven-publish'
    id 'signing'
}


apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'

task sourcesJar(type: Jar) {
	 archiveClassifier = 'sources'
	 manifest {
        attributes("Built-By": "Mathieu Fortin",
        		   "Specification-Title": "CFSForestTools sources",
	       		   "Specification-Version": project.version,                   
                   "Specification-Vendor": "CFS",
                   "Implementation-Title": "cfsforesttools",
                   "Implementation-Version": project.version,
                   "Implementation-Vendor": "CFS",
                   )
    }
   	duplicatesStrategy = DuplicatesStrategy.EXCLUDE		// to avoid duplicate files
    
	into ('/') {
		from files(['./README.md', './LICENSE.md'])			
	}
	
	// include all java files from main sourceset into the jar file (resources are already included)
	from sourceSets.main.java
//	from sourceSets.main.resources		
}


java {
  toolchain {
    languageVersion.set(JavaLanguageVersion.of(8))
  }
  withJavadocJar()
  withSourcesJar()
}

repositories {
	maven {		// sonatype repository
		url "https://repo1.maven.org/maven2/"
	}
    mavenCentral()
    mavenLocal()
}


println "Using java version " + JavaVersion.current()

sourceSets {
    main {    	
        java {
            srcDirs 'src'            
        }
        
        resources {
			srcDirs= ['src']
			exclude '**/*.java'
		}
		
		output.resourcesDir = "$buildDir/classes/java/$name"
    }

    test {
        java {
            srcDirs 'test/src'
        }
                
        resources {
			srcDirs= ['test/src']
			exclude '**/*.java'
		}
		
		output.resourcesDir = "$buildDir/classes/java/$name"
    }               
}

configurations {
	cfsForesttoolsImplementation {
		extendsFrom implementation
		description = 'Main implementation'
		canBeResolved = true
	}
}

dependencies {
    implementation group: 'io.github.cwfc-ccfb', name: 'repicea', version: '1.17.+'    
    implementation group: 'io.github.cwfc-ccfb', name: 'repicea-mathstats', version: '1.8.+'    
    implementation group: 'io.github.cwfc-ccfb', name: 'repicea-simulation', version: '1.6.+'    
    implementation group: 'io.github.cwfc-ccfb', name: 'biosimclient', version: '1.3.+'    
   
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.20.0-rc1'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.20.0-rc1'
   
    testImplementation "junit:junit:4.12"    
}

compileJava {
	project.version= gitVersion() 
	println "Building " + rootProject.name + " " + project.version
	println "Installation directory " + "../externallibraries/" + rootProject.name
}

test {
    // show standard out and standard error of the test JVM(s) on the console
    testLogging.showStandardStreams = true

    // set heap size for the test JVM(s)
    maxHeapSize = "2048m"
    
    exclude '**/ProductionEnvironmentTest.class'
}

jar {
	manifest {
       attributes("Built-By": "Mathieu Fortin",
        		   "Specification-Title": "CFSForestTools sources",
	       		   "Specification-Version": project.version,                   
                   "Specification-Vendor": "CFS",
                   "Implementation-Title": "cfsforesttools",
                   "Implementation-Version": project.version,
                   "Implementation-Vendor": "CFS",
                   )
    }

    exclude '**/*.java'
        
	into ('/') {
		from files(['./README.md', './LICENSE.md'])			
	}
	
	// include all java files from main sourceset into the jar file (resources are already included)
	from sourceSets.main.allJava		
}

task integrationTest(type: Test) {
	description = 'Runs the integration tests.'
    group = 'verification'
	dependsOn jar
	
	include '**/*.class'
	
	testLogging.showStandardStreams = true
    testClassesDirs = sourceSets.test.output.classesDirs
        
    // set classpath to test classes + test dependencies + JAR
    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile) 
    outputs.upToDateWhen { false }
    mustRunAfter test
    maxHeapSize = "2048m"
}

check.dependsOn integrationTest

task deleteInstallFolder(type: Delete) {
  delete "../externallibraries/" + rootProject.name
}

task install(type: Copy) {
	description = 'Copies the output jar to installation folder.'
	group = 'build'
	dependsOn deleteInstallFolder //,integrationTest
	from configurations.cfsForesttoolsImplementation
	from jar
	into "../externallibraries/" + rootProject.name
}

publishing {
    publications {
        cfsforesttools(MavenPublication) {
          	from components.java
        	pom {
        		name = 'CFSForesttools'
				group = 'io.github.cwfc-ccfb'
        		description = 'Support for growth models in France'
        		url = 'https://github.com/CWFC-CCFB/cfsforesttools'
        		properties = [
        			packaging: "jar"
	       		]
        		licenses {
        			license {
        				name = 'GNU Lesser General Public License 3'
        				url  = 'https://www.gnu.org/licenses/lgpl-3.0'
        			}
        		}
        		developers {
        			developer {
        				id = 'matfortin'
        				name = 'Mathieu Fortin'
        				email = 'mathieu.fortin.re@gmail.com'
        			}        
        		}
        		
                scm {
          			connection = 'scm:git:https://github.com/CWFC-CCFB/cfsforesttools'
          			developerConnection = 'scm:git:https://github.com/CWFC-CCFB/cfsforesttools'
          			url = 'https://github.com/CWFC-CCFB/cfsforesttools'
        		}
		     }	
        }
    }
    repositories {
        maven {
            name = 'LocalFile'
            url = "file://${buildDir}/repo"
        }

		maven {
		 	name = 'Sonatype'
		 	credentials(PasswordCredentials)
		 	url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
		}
    }
}

signing {
    sign publishing.publications.cfsforesttools
}

publishCfsforesttoolsPublicationToLocalFileRepository {
	dependsOn jar
}

